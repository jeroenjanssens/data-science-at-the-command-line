project:
  type: book
  output-dir: _book
  # Files that pages link to, copied to _book
  resources:
    - resources/50-reasons.pdf
  # Writes _variables.yml with today's date for the page footer
  pre-render: bin/last-updated.sh

book:
  title: "Data Science at the Command Line, 2e"
  subtitle: "Obtain, Scrub, Explore, and Model Data with Unix Power Tools"
  author:
    name: "Jeroen Janssens"
    url: https://jeroenjanssens.com
  # The second edition was published by O'Reilly in October 2021 (the day isn't shown)
  date: 2021-10-01
  date-format: "MMMM YYYY"
  # cover.png is the Early Release cover; 2e displayed cover-small.png
  cover-image: images/cover-small.png
  description: "This thoroughly revised guide demonstrates how the flexibility of the command line can help you become a more efficient and productive data scientist. You'll learn how to combine small yet powerful command-line tools to quickly obtain, scrub, explore, and model your data. To get you started, author Jeroen Janssens provides a Docker image packed with over 100 Unix power tools—useful whether you work with Windows, macOS, or Linux."
  repo-url: https://github.com/jeroenjanssens/data-science-at-the-command-line
  repo-subdir: book/2.5e
  site-url: https://dsatcl.jeroenjanssens.com
  repo-branch: main
  repo-actions: [edit, source]
  page-footer:
    center: "Rendered with [Quarto](https://quarto.org) and [quarto-term](https://quarto-term.jeroenjanssens.com). Last updated on {{< var last-updated >}}."
  open-graph: true
  twitter-card: true
  chapters:
    - index.qmd
    - foreword.qmd
    - preface.qmd
    - chapter-1-introduction.qmd
    - chapter-2-getting-started.qmd
    - chapter-3-obtaining-data.qmd
    - chapter-4-creating-command-line-tools.qmd
    - chapter-5-scrubbing-data.qmd
    - chapter-6-project-management-with-make.qmd
    - chapter-7-exploring-data.qmd
    - chapter-8-parallel-pipelines.qmd
    - chapter-9-modeling-data.qmd
    - chapter-10-polyglot-data-science.qmd
    - chapter-11-conclusion.qmd
    - list-of-command-line-tools.qmd
    - references.qmd

bibliography: [library.bib, tools.bib]
csl: chicago-fullnote-bibliography.csl
notes-after-punctuation: false
link-citations: true
# List every entry of both .bib files on the references page.
nocite: "@*"
# Only references.qmd shows the list; elsewhere citations are footnotes.
suppress-bibliography: true

filters:
  - term

format:
  html:
    # bookdown turned bare URLs into links; keep doing that
    from: markdown+autolink_bare_uris
    include-in-header: favicon.html
    code-copy: true
    # Light and dark mode, with a toggle; start in the reader's system preference
    theme:
      light: default
      dark: [darkly, dark.scss]
    respect-user-color-scheme: true
    css: styles.css

extensions:
  term:
    # No shell: the image's own zsh (its ENTRYPOINT) starts with its .zshrc
    prompt: "$"
    timeout: 30
    spacing: true
    callout-values: "➊➋➌➍➎➏➐➑➒"
    callout-format: "{}"
    # The numbered list after a cell gets the same markers (➊, ➋, ...)
    callout-list: true
    # Scripts mounted at /.book (hidden, so `tree /` doesn't show it) and sourced by init are part of the cache key
    cache-depends:
      - container
    style:
      cols: 80
      rows: 16
      # 80 columns fit the text column without a horizontal scrollbar at 1440px and wider
      font-size: 0.83em
      # Dark terminal blocks in light mode, light ones in dark mode
      colorscheme-light: catppuccin-frappe
      colorscheme-dark: catppuccin-latte
    docker:
      image: datasciencetoolbox/dsatcl2e:latest
      # Pulled before the cache key is computed, so a new image re-runs pages
      pull: always
      volumes:
        - ./images:/images
        - ./history:/history
        - ./data:/data.bak
        - ./container:/.book:ro
    init:
      - "source /.book/setup.zsh"
      # Functions are typed instead of sourced, so `type csvlook` says "csvlook
      # is a shell function" (like 2e) and not "... from /.book/setup.zsh".
      # csvlook draws boxes; only line 2 (the header separator) has dashes to
      # replace, so negative numbers elsewhere are left alone. Inline code, so
      # Pandoc doesn't read the commands as Markdown.
      - '`function csvlook { command csvlook "$@" | trim | sed ''2s/- | -/──┼──/g;2s/| -/├──/g;2s/- |/──┤/;s/|/│/g;2s/-/─/g'' }`'
      - '`function display { mv $1 /images/ }`'
